<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links – Navid Sheybani</title>
<style>
  :root {
    --ink: #333333;
    --ink-soft: #555555;
    --link: #5c4a8a;
    --link-active: #6b3f6b;
    --rule: #444444;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0 auto;
    padding: 2rem 2.5rem 4rem;
    max-width: 62rem;
    font-family: "Times New Roman", Times, serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    background: #ffffff;
  }

  nav {
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--rule);
  }

  nav ul {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  nav a {
    color: var(--link);
    text-decoration: none;
    font-size: 1.05rem;
  }

  nav a:hover,
  nav a:focus-visible { text-decoration: underline; }

  nav a[aria-current="page"] {
    color: var(--link-active);
    font-weight: 700;
  }

  a:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 3px;
  }

  main {
    margin-top: 2.5rem;
    padding-left: 1rem;
  }

  h1 {
    margin: 0 0 1.25rem;
    font-size: 2.1rem;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: #2b2b2b;
  }

  main p { margin: 0 0 1em; max-width: 36em; }

  main a { color: var(--link); }

  @media (max-width: 860px) {
    h1 { font-size: 1.55rem; }
    body { padding: 1.5rem 1.25rem 3rem; font-size: 15px; }
    nav ul { gap: 1.1rem; }
    nav a { font-size: 0.95rem; }
    main { padding-left: 0; margin-top: 1.75rem; }
  }

  @media (max-width: 560px) {
    h1 { font-size: 1.25rem; margin-bottom: 0.9rem; }
    body { font-size: 13.5px; }
    nav ul { gap: 0.85rem; }
    nav a { font-size: 0.85rem; }
  }
</style>
</head>
<body>

<nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About me</a></li>
    <li><a href="research.html">Research</a></li>
    <li><a href="coursework.html">Coursework</a></li>
    <li><a href="cv.html">CV</a></li>
    <li><a href="links.html" aria-current="page">Links</a></li>
  </ul>
</nav>

<main>
  <h1>Links</h1>
  <p>A link to the code for this website (via GitHub): <a href="https://github.com/nsheybani/me">https://github.com/nsheybani/me</a>.</p>
</main>

</body>
</html>
