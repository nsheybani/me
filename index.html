<style>
  :root {
    --ink: #333333;
    --ink-soft: #555555;
    --link: #5c4a8a;
    --link-active: #6b3f6b;
    --rule: #444444;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0 auto;
    padding: 2rem 2.5rem 4rem;
    max-width: 62rem;
    font-family: "Helvetica Neue", "HelveticaNeue", Helvetica, Arial, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    background: #ffffff;
  }

  nav {
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--rule);
  }

  nav ul {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2.25rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  nav a {
    color: var(--link);
    text-decoration: none;
    font-size: 1.05rem;
  }

  nav a:hover,
  nav a:focus-visible { text-decoration: underline; }

  nav a[aria-current="page"] {
    color: var(--link-active);
    font-weight: 700;
  }

  /* Text left, figure right — stays side by side at every width, like the reference. */
  .content {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr);
    gap: 3rem;
    align-items: start;
    margin-top: 2.5rem;
    padding-left: 1rem;
  }

  h1 {
    margin: 0 0 1.25rem;
    font-size: 2.1rem;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: #2b2b2b;
  }

  address {
    font-style: normal;
    margin: 0 0 1.5rem;
  }

  .contact { margin: 0; }

  a[href^="mailto:"] { color: var(--link); }

  figure {
    margin: 0;
    max-width: 30rem;
  }

  figure img {
    display: block;
    width: 100%;
    height: auto;
  }

  figcaption {
    margin-top: 0.85rem;
    font-size: 0.78rem;
    line-height: 1.45;
    color: var(--ink-soft);
  }

  figcaption a {
    color: var(--ink-soft);
    word-break: break-word;
  }

  @media (max-width: 860px) {
    body { padding: 1.5rem 1.25rem 3rem; font-size: 15px; }
    .content { padding-left: 0; }
    nav ul { gap: 1.1rem; }
    nav a { font-size: 0.95rem; }
    .content { gap: 1.5rem; margin-top: 1.75rem; }
    h1 { font-size: 1.55rem; }
    figcaption { font-size: 0.68rem; }
  }

  @media (max-width: 560px) {
    body { font-size: 13.5px; }
    nav ul { gap: 0.85rem; }
    nav a { font-size: 0.85rem; }
    .content { gap: 1.1rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.9rem; }
    figcaption { font-size: 0.6rem; }
  }
</style>
